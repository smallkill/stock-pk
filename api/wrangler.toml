name = "stock-pk-api"
main = "src/index.ts"
compatibility_date = "2025-09-06"

[[d1_databases]]
binding = "DB"
database_name = "stockpk"
database_id = "28c3bf82-2587-47a7-8d46-1dee03c6eeb7"

# Service binding:呼叫 Derek 的 devbox 短網址服務(同帳號內部直連,避開 error 1042)。
[[services]]
binding = "DEVBOX"
service = "devbox-api"

# 速率煞車(per-colo 寬鬆過濾):compare/share 各以 per-IP key 限 20/分。
[[ratelimits]]
name = "RL"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# share 全域上限(不分 IP):防分散來源繞過 per-IP 無上限地在 devbox D1 建列。
[[ratelimits]]
name = "RL_SHARE_GLOBAL"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

# secret: wrangler secret put VISIT_SALT
# secret: wrangler secret put CREATE_TOKEN(devbox 建短網址的 bearer)
